name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      REDIS_URL: redis://localhost:6379/0
      CACHE_ENABLED: "true"
      SESSION_SECRET: ci-placeholder
      DATABASE_URL: sqlite+aiosqlite:///./ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check

      - name: Test
        run: pytest -q

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api.chamathdilshan.dev:ci .
